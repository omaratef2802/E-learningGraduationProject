<section class="instructors-section" aria-labelledby="instructors-title">
  <div class="instructors-heading">
    <span class="section-eyebrow">{{ config.eyebrow }}</span>
    <h2 id="instructors-title">{{ config.title }}</h2>
    <p>{{ config.description }}</p>
  </div>

  <div class="instructors-grid">
    @for (instructor of config.items; track instructor.name) {
      <article class="instructor-card" [class]="instructor.tone">
        <div class="portrait-wrap"><span class="portrait-ring"></span><img [src]="instructor.image" [alt]="instructor.name" /></div>
        <h3>{{ instructor.name }}</h3>
        <span class="instructor-role">{{ instructor.role }}</span>
        <p>{{ instructor.bio }}</p>
        <div class="instructor-stats"><span><b>★</b> {{ instructor.rating }} Rating</span><span>{{ instructor.learners }} Learners</span></div>
        <button type="button" (click)="viewInstructor(instructor.name)" [attr.aria-label]="'View courses by ' + instructor.name">View profile <strong>→</strong></button>
      </article>
    }
  </div>
</section>
