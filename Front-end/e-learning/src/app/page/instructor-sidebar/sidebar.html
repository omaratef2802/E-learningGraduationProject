<aside class="sidebar">
  <div class="sidebar-header">
    <a class="dashboard-brand" routerLink="/instructor-dashboard" aria-label="PathwayEd dashboard">
    <span class="brand-icon">◆</span>
    <span><strong>{{ config.brand }}</strong><small>{{ config.role }}</small></span>
    </a>
    <button class="sidebar-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle instructor navigation">☰</button>
  </div>

  <nav class="sidebar-nav" [class.open]="menuOpen" aria-label="Instructor navigation">
    @for (item of config.items; track item.label) {
      <button type="button" [class.active]="isActive(item.route, item.label)" (click)="navigate(item.route)">
        <span class="nav-icon">{{ item.icon }}</span>{{ item.label }}
      </button>
    }
  </nav>

  <div class="sidebar-profile">
    <span class="avatar">{{ profileInitial }}</span>
    <span><strong>{{ profileName }}</strong><small>{{ config.profileRole }}</small></span>
    <button type="button" aria-label="Account menu">⌄</button>
  </div>
</aside>
