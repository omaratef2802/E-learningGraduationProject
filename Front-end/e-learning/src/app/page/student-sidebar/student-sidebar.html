<aside class="student-sidebar">
  <div class="sidebar-header">
    <a class="dashboard-brand" routerLink="/student-dashboard" aria-label="PathwayEd student dashboard">
      <span class="brand-icon">P</span>
      <span><strong>{{ config.brand }}</strong><small>{{ config.role }}</small></span>
    </a>
    <button class="sidebar-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle student navigation">☰</button>
  </div>

  <span class="nav-caption">LEARNING MENU</span>
  <nav class="sidebar-nav" [class.open]="menuOpen" aria-label="Student navigation">
    @for (item of config.items; track item.label) {
      <button type="button" [class.active]="isActive(item.route)" (click)="navigate(item.route)">
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
        @if (item.route === '/cart' && cartCount() > 0) { <span class="nav-count">{{ cartCount() }}</span> }
        @if (isActive(item.route)) { <span class="active-mark" aria-hidden="true"></span> }
      </button>
    }
  </nav>

  <div class="sidebar-bottom">
    <div class="sidebar-profile">
      <span class="avatar">{{ profileInitial }}</span>
      <span class="profile-copy"><strong>{{ profileName }}</strong><small>Student account</small></span>
      <button type="button" (click)="logout()" aria-label="Log out" title="Log out">↗</button>
    </div>
  </div>
</aside>
