<aside class="w-64 h-screen sticky top-0 flex flex-col justify-between p-5 bg-[#F4F5F8]/80 backdrop-blur-sm border-r border-slate-200/60 select-none">
  <!-- Top Section: Brand & Navigation -->
  <div class="flex flex-col">
    <!-- Brand Header -->
    <div class="px-2 pt-1 pb-4">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-blue-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
        </div>
        <span class="text-[17px] font-bold tracking-tight text-slate-900">
          Pathway<span class="text-indigo-600">Ed</span>
        </span>
      </div>
      <div class="mt-1 pl-0.5">
        <span class="text-[10px] font-bold tracking-widest text-indigo-600 uppercase">
          STUDENT
        </span>
      </div>
    </div>

    <nav class="mt-4">
      <ul class="space-y-1">
        @for (item of navItems(); track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="active-nav-link"
              [routerLinkActiveOptions]="{ exact: false }"
              class="group flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-[14px] font-medium text-slate-500 transition-all duration-200 hover:text-slate-900 hover:bg-white/70"
            >
              <div class="flex items-center gap-3.5 min-w-0">
                <ng-icon
                  [name]="item.icon"
                  size="1.2rem"
                  class="shrink-0 transition-transform duration-200 group-hover:scale-105"
                />
                <span class="tracking-tight truncate">{{ item.label }}</span>
              </div>
              @if (item.badge) {
                <span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">
                  {{ item.badge }}
                </span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <!-- Bottom Section: User Info Card -->
  <div class="pt-4">
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-2.5 pl-3 border border-slate-200/70 shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex items-center justify-between gap-2.5 hover:border-slate-300/80 transition-colors">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Avatar -->
        <div class="relative shrink-0">
          <img
            [src]="currentUser().avatarUrl"
            [alt]="currentUser().name"
            class="w-9 h-9 rounded-full object-cover ring-1 ring-slate-100"
            (error)="currentUser().avatarUrl = 'https://ui-avatars.com/api/?name=Naema+Chen&background=6366f1&color=fff'"
          />
          @if (currentUser().status === 'online') {
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
          }
        </div>

        <!-- Name & Workspace -->
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-semibold text-slate-900 truncate leading-tight">
            {{ currentUser().name }}
          </span>
          <span class="text-[11px] text-slate-400 truncate leading-normal">
            {{ currentUser().role }}
          </span>
        </div>
      </div>

      <!-- Logout Action Button -->
      <button
        type="button"
        (click)="onLogout()"
        title="Log out"
        class="shrink-0 p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
        aria-label="Log out"
      >
        <ng-icon name="lucideLogOut" size="1.15rem" />
      </button>
    </div>
  </div>
</aside>
