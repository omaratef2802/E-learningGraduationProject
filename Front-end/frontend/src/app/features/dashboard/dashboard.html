<div class="dashboard-container">
  <!-- Dashboard Welcome Section (Immediately below the Shared Header) -->
  <section class="welcome-section">
    <h1 class="welcome-title">
      Welcome back, {{ userName() }}
    </h1>
    <p class="welcome-subtitle">
      Pick up where you left off today.
    </p>
  </section>

  <!-- Key Metrics: 3 Stat Cards -->
  <section class="stats-grid">
    @for (stat of stats; track stat.id) {
      <app-stat-card [stat]="stat" />
    }
  </section>

  <!-- Hero: Continue Where You Left Off -->
  <section>
    <app-continue-learning [item]="continueLearning" />
  </section>

  <!-- My Courses Section -->
  <section class="courses-section">
    <!-- Courses Section Header -->
    <div class="courses-header">
      <div class="courses-title-group">
        <h2 class="courses-heading">My Courses</h2>
        <span class="courses-count-pill">{{ courses.length }} In Progress</span>
      </div>

      <a routerLink="/my-learning" class="view-all-link">
        <span>View All Courses</span>
        <ng-icon name="lucideArrowRight" size="0.95rem" />
      </a>
    </div>

    <!-- Courses Grid -->
    <div class="courses-grid">
      @for (course of courses; track course.id) {
        <app-course-card [course]="course" />
      }
    </div>
  </section>

  <!-- Weekly Learning Rhythm Section -->
  <section>
    <app-weekly-learning [weeklyGoal]="weeklyGoal" />
  </section>
</div>
