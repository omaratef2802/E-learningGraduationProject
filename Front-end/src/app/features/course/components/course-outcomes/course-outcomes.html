<section class="card what-learn-card">
  <div class="section-card-header">
    <div class="title-with-icon">
      <svg class="sparkle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"></path>
      </svg>
      <h2>What you'll learn</h2>
    </div>
    <span class="outcome-tag">Course Outcomes</span>
  </div>

  <div class="outcomes-grid">
    @for (item of outcomes; track item) {
      <div class="outcome-box">
        <span class="check-circle-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span class="outcome-text">{{ item }}</span>
      </div>
    }
  </div>

  <div class="show-more-wrap">
    <button type="button" class="show-more-link" (click)="toggleExpand()">
      {{ isExpanded() ? 'Show Less' : 'Show More' }}
      <svg
        class="chevron-icon"
        [class.rotated]="isExpanded()"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
</section>
