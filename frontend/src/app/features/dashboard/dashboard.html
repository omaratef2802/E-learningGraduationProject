<div class="dashboard-container">
  <!-- Top App Header -->
  <header class="dashboard-header">
    <div class="header-greeting">
      <h1 class="welcome-title">
        Welcome back, {{ userName() }}
      </h1>
      <p class="welcome-subtitle">
        Pick up where you left off today.
      </p>
    </div>

    <div class="header-actions">
      <!-- Search Bar -->
      <div class="search-bar">
        <span class="search-icon">
          <ng-icon name="lucideSearch" size="1.05rem" />
        </span>
        <input
          type="text"
          placeholder="Search your courses & lessons..."
          class="search-input"
        />
      </div>

      <!-- Top Right Profile Avatar -->
      <div class="user-avatar-wrapper">
        <img
          [src]="userAvatar()"
          alt="Student Avatar"
          class="user-avatar-img"
        />
        <span class="online-indicator"></span>
      </div>
    </div>
  </header>

  <!-- Key Metrics: 3 Stat Cards -->
  <section class="stats-grid">
    @for (stat of stats; track stat.id) {
      <app-stat-card [stat]="stat" />
    }
  </section>

  <!-- Hero: Continue Where You Left Off -->
  <section>
    <app-continue-learning [item]="continueLearning" />
  </section>

  <!-- My Courses Section -->
  <section class="courses-section">
    <!-- Courses Section Header -->
    <div class="courses-header">
      <div class="courses-title-group">
        <h2 class="courses-heading">My Courses</h2>
        <span class="courses-count-pill">{{ courses.length }} In Progress</span>
      </div>

      <a routerLink="/courses" class="view-all-link">
        <span>View All Courses</span>
        <ng-icon name="lucideArrowRight" size="0.95rem" />
      </a>
    </div>

    <!-- Courses Grid -->
    <div class="courses-grid">
      @for (course of courses; track course.id) {
        <app-course-card [course]="course" />
      }
    </div>
  </section>

  <!-- Weekly Learning Rhythm Section -->
  <section>
    <app-weekly-learning [weeklyGoal]="weeklyGoal" />
  </section>
</div>
