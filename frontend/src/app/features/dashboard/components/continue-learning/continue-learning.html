<div class="continue-card">
  <div class="continue-content">
    <!-- Pill Badge -->
    <div class="badge-wrapper">
      <span class="badge-dot"></span>
      <span class="badge-text">CONTINUE WHERE YOU LEFT OFF</span>
    </div>

    <!-- Category -->
    <div class="continue-category">
      {{ item.category }}
    </div>

    <!-- Title -->
    <h2 class="continue-title">
      {{ item.title }}
    </h2>

    <!-- Metadata row -->
    <div class="continue-meta">
      <div class="meta-item">
        <ng-icon name="lucideBookOpen" size="0.95rem" />
        <span>Lesson {{ item.currentLesson }} of {{ item.totalLessons }}</span>
      </div>

      <span class="meta-separator">•</span>

      <div class="meta-item">
        <ng-icon name="lucideClock" size="0.95rem" />
        <span>{{ item.remainingMinutes }} min remaining</span>
      </div>

      <span class="meta-separator">•</span>

      <div class="progress-section">
        <div class="progress-bar-bg">
          <div
            class="progress-bar-fill"
            [style.width.%]="item.progressPercent"
          ></div>
        </div>
        <span class="progress-text">{{ item.progressPercent }}% Completed</span>
      </div>
    </div>
  </div>

  <!-- Action button -->
  <button
    type="button"
    (click)="onResume()"
    class="resume-btn"
  >
    <div class="resume-icon">
      <ng-icon name="lucidePlay" size="1.05rem" />
    </div>
    <span>Resume Lesson</span>
  </button>
</div>
